<svg xmlns="http://www.w3.org/2000/svg" width="680" height="180" viewBox="0 0 680 180" role="img" style="font-family:'Segoe UI',-apple-system,BlinkMacSystemFont,Helvetica,Arial,sans-serif"><title>Contribution streak</title><style>.c1{animation:up .8s ease-out both}.c2{animation:up .8s ease-out .3s both}.c3{animation:up .8s ease-out .6s both}@keyframes up{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}#rg{stroke-dasharray:214;animation:ring 1.6s ease-out .4s both}@keyframes ring{from{stroke-dashoffset:214}to{stroke-dashoffset:0}}#gl{animation:gl 1.2s ease-out 1.9s both}@keyframes gl{0%{opacity:0}40%{opacity:.22}100%{opacity:0}}#fm{transform-box:fill-box;transform-origin:50% 100%;animation:fm 1.2s ease-out 1.9s both}@keyframes fm{0%{transform:scale(0);opacity:0}45%{transform:scale(1.25,1.35);opacity:1}70%{transform:scale(.95);opacity:1}100%{transform:scale(1);opacity:1}}</style><rect width="680" height="180" rx="14" fill="#111418"/><rect x=".5" y=".5" width="679" height="179" rx="14" fill="none" stroke="#262C34"/><text x="24" y="30" text-anchor="start" style="font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:11px;font-weight:600;letter-spacing:2px;fill:#E9B949">STREAK</text><path d="M230 56V156M450 56V156" stroke="#262C34"/><g class="c1"><text x="120" y="100" text-anchor="middle" style="font-size:24px;font-weight:700;letter-spacing:0px;fill:#E6EDF3">2,359</text><text x="120" y="122" text-anchor="middle" style="font-size:12px;font-weight:400;letter-spacing:0px;fill:#C9D1D9">Total contributions</text><text x="120" y="140" text-anchor="middle" style="font-size:11px;font-weight:400;letter-spacing:0px;fill:#6E7681">Oct 13, 2023 – Present</text></g><circle cx="340" cy="94" r="34" fill="none" stroke="#2A3038" stroke-width="4"/><circle id="gl" cx="340" cy="94" r="34" fill="none" stroke="#E9B949" stroke-width="12"/><circle id="rg" cx="340" cy="94" r="34" fill="none" stroke="#E9B949" stroke-width="4" stroke-linecap="round" transform="rotate(-90 340 94)"/><path id="fm" d="M340 52c4 5 7 8 7 12a7 7 0 0 1-14 0c0-3 2-5 3-7c1 3 2 4 4 4c0-3-1-6 0-9z" fill="#E8743B" stroke="#111418" stroke-width="2"/><g class="c2"><text x="340" y="103" text-anchor="middle" style="font-size:26px;font-weight:700;letter-spacing:0px;fill:#E9B949">36</text><text x="340" y="146" text-anchor="middle" style="font-size:12px;font-weight:600;letter-spacing:0px;fill:#E9B949">Longest streak · days</text><text x="340" y="164" text-anchor="middle" style="font-size:11px;font-weight:400;letter-spacing:0px;fill:#6E7681">Oct 16 – Nov 20, 2025</text></g><g class="c3"><text x="560" y="100" text-anchor="middle" style="font-size:24px;font-weight:700;letter-spacing:0px;fill:#E6EDF3">566</text><text x="560" y="122" text-anchor="middle" style="font-size:12px;font-weight:400;letter-spacing:0px;fill:#C9D1D9">Best month</text><text x="560" y="140" text-anchor="middle" style="font-size:11px;font-weight:400;letter-spacing:0px;fill:#6E7681">September 2026</text></g></svg>