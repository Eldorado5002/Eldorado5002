name: Generate contribution snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Generate snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-raw.svg?color_snake=#7FB0DC&color_dots=#1E242C,#4A3A16,#7A5D1C,#B88A24,#E9B949

      - name: Frame the snake
        run: |
          python3 - <<'PY'
          import re, pathlib
          raw_path = pathlib.Path("dist/snake-raw.svg")
          raw = re.sub(r"<\?xml[^>]*\?>", "", raw_path.read_text()).strip()
          open_tag = re.match(r"<svg[^>]*>", raw).group(0)
          vb = re.search(r'viewBox="([^"]+)"', open_tag).group(1)
          vx, vy, vw, vh = (float(v) for v in vb.replace(",", " ").split())
          body = raw[len(open_tag):]
          body = body[: body.rfind("</svg>")]
          W = 900
          iw = W - 48
          ih = iw * vh / vw
          top = 52
          H = round(top + ih + 28)
          mono = "ui-monospace,SFMono-Regular,Menlo,Consolas,monospace"
          sans = "'Segoe UI',-apple-system,BlinkMacSystemFont,Helvetica,Arial,sans-serif"
          svg = (
              f'<svg xmlns="http://www.w3.org/2000/svg" width="{W}" height="{H}" viewBox="0 0 {W} {H}" role="img">'
              "<title>Contribution snake</title>"
              f'<rect width="{W}" height="{H}" rx="14" fill="#111418"/>'
              f'<rect x=".5" y=".5" width="{W-1}" height="{H-1}" rx="14" fill="none" stroke="#262C34"/>'
              f'<text x="24" y="34" font-family="{mono}" font-size="11" letter-spacing="2" font-weight="600" fill="#E9B949">CONTRIBUTIONS</text>'
              f'<text x="146" y="34" font-family="{sans}" font-size="11" fill="#8B949E">a year of commits, eaten daily</text>'
              f'<svg x="24" y="{top}" width="{iw:.1f}" height="{ih:.1f}" viewBox="{vb}">{body}</svg>'
              "</svg>"
          )
          pathlib.Path("dist/snake.svg").write_text(svg)
          raw_path.unlink()
          PY

      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
