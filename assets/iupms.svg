<g fill="#3F6B2A"><circle cx="30" cy="223" r="5"/><circle cx="74" cy="223" r="5"/><circle cx="118" cy="223" r="5"/><circle cx="162" cy="223" r="5"/><circle cx="206" cy="223" r="5"/><circle cx="250" cy="223" r="5"/><circle cx="350" cy="223" r="5"/><circle cx="394" cy="223" r="5"/><circle cx="438" cy="223" r="5"/><circle cx="482" cy="223" r="5"/><circle cx="526" cy="223" r="5"/><circle cx="570" cy="223" r="5"/><circle cx="614" cy="223" r="5"/><circle cx="658" cy="223" r="5"/></g>
<text x="150" y="196" class="m" style="font-size:11px;letter-spacing:3px;fill:#ECEFF1;opacity:.6">ENTRY</text>
<text x="590" y="168" class="m" style="font-size:11px;letter-spacing:3px;fill:#ECEFF1;opacity:.6">EXIT →</text>
<circle cx="436" cy="59" r="3.5" fill="#F85149"/><circle cx="476" cy="59" r="3.5" fill="#F85149"/><circle cx="516" cy="59" r="3.5" fill="#3FB950"/><circle cx="556" cy="59" r="3.5" fill="#F85149"/><circle cx="596" cy="59" r="3.5" fill="#3FB950"/><circle cx="636" cy="59" r="3.5" fill="#F85149"/>
<circle class="a" style="animation-name:l3" cx="516" cy="59" r="3.5" fill="#F85149"/>
<circle class="a" style="animation-name:l5" cx="596" cy="59" r="3.5" fill="#F85149"/>
<circle class="a" style="animation-name:l6" cx="636" cy="59" r="3.5" fill="#3FB950"/>
<use href="#car" transform="translate(436 104) rotate(-90)" style="color:#26282C"/>
<use href="#car" transform="translate(476 104) rotate(-90)" style="color:#2F5D9E"/>
<use href="#car" transform="translate(556 104) rotate(-90)" style="color:#2E7D4F"/>
<line x1="270" y1="94" x2="270" y2="149" stroke="#7A7F86" stroke-width="2.5"/>
<polygon points="266,94 232,204 296,204" fill="#FFFFFF" style="animation:cone 1.8s ease-in-out infinite"/>
<rect x="256" y="80" width="28" height="14" rx="3" fill="#2B2F35" stroke="#15181C"/>
<circle cx="278" cy="87" r="3" fill="#0E1116" stroke="#9AA4AE"/>
<rect x="20" y="58" width="172" height="46" rx="6" fill="#0E1116" fill-opacity=".88"/>
<text x="32" y="76" class="m mu">YOLOv8</text>
<text x="32" y="94" class="m mu">OCR</text>
<text x="92" y="76" class="m a" style="animation-name:hd;font-size:11px;fill:#3FE07A">car detected</text>
