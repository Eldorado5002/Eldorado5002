<g class="a" style="animation-name:tb"><rect x="234" y="161" width="62" height="14" rx="2" fill="#3FE07A"/><text x="238" y="172" class="m" style="font-size:11px;fill:#0E1116">car 0.91</text></g>
<g class="a gt" style="animation-name:gate"><line x1="300" y1="211" x2="300" y2="152" stroke="#D32F2F" stroke-width="4.5" stroke-linecap="round"/><line x1="300" y1="205" x2="300" y2="156" stroke="#FFFFFF" stroke-width="4.5" stroke-dasharray="6 7"/></g>
<rect x="294" y="205" width="12" height="12" rx="2" fill="#5B6068"/>
</g>
<text x="24" y="252" class="mu">30 FPS detection · under 500 ms gate response</text>
</g>
<rect x=".5" y=".5" width="679" height="263" rx="14" fill="none" stroke="#232A33"/>
</svg>
